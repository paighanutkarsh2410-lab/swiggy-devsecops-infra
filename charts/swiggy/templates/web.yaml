{{- /* One Service and Deployment per website: the customer app and the partner console. */}}
{{- range $name, $site := .Values.web }}
---
# {{ $site.description }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "swiggy.labels" $ | nindent 4 }}
spec:
  {{- if $site.nodePort }}
  type: NodePort
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      {{- with $site.nodePort }}
      nodePort: {{ . }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "swiggy.labels" $ | nindent 4 }}
spec:
  replicas: {{ $site.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- include "swiggy.labels" $ | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ include "swiggy.image" (dict "root" $ "name" $site.image) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml $.Values.webResources | nindent 12 }}
          securityContext:
            {{- include "swiggy.containerSecurity" $ | nindent 12 }}
          volumeMounts:
            # nginx-unprivileged keeps its pid file and caches in /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
