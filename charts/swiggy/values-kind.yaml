# Local kind cluster. Argo CD deploys the chart with this file.
image:
  # Updated by pull requests from swiggy-devsecops-app's CI.
  tag: "3ad7a098d24fe97c49d352955198b94e4a0f5b68"

web:
  frontend:
    # kind/cluster.yaml maps this to http://localhost:8081.
    nodePort: 30080
  partner:
    # kind/cluster.yaml maps this to http://localhost:8083.
    nodePort: 30082

# kube-prometheus-stack runs on kind (argocd/monitoring.yaml).
monitoring:
  enabled: true
