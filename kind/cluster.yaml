apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: swiggy
nodes:
  - role: control-plane
    extraPortMappings:
      # Customer app: NodePort 30080 inside the cluster, port 8081 on the host.
      - containerPort: 30080
        hostPort: 8081
        listenAddress: "0.0.0.0"
        protocol: TCP
      # Partner console: NodePort 30082 inside the cluster, port 8083 on the host.
      - containerPort: 30082
        hostPort: 8083
        listenAddress: "0.0.0.0"
        protocol: TCP
