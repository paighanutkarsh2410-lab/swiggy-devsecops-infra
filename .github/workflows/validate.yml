name: Validate Infrastructure

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.6.7
  TERRAFORM_VERSION: 1.17.1
  HELM_VERSION: v4.3.1

jobs:
  kubernetes:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint the chart for each environment
        run: |
          helm lint --strict charts/swiggy -f charts/swiggy/values-kind.yaml
          helm lint --strict charts/swiggy -f charts/swiggy/values-aws.yaml \
            --set ingress.partnerHost=partner.192-0-2-10.sslip.io

      - name: Render the chart for each environment
        run: |
          helm template swiggy charts/swiggy -n swiggy \
            -f charts/swiggy/values-kind.yaml > rendered-kind.yaml
          helm template swiggy charts/swiggy -n swiggy \
            -f charts/swiggy/values-aws.yaml \
            --set ingress.partnerHost=partner.192-0-2-10.sslip.io > rendered-aws.yaml

      - name: Check both environments deploy the same images
        run: |
          images() { grep -oE 'swiggy-devsecops-[a-z]+:[0-9a-f]{40}(@sha256:[0-9a-f]{64})?' "$1" | sort -u; }
          echo "kind:"; images rendered-kind.yaml
          echo "aws:";  images rendered-aws.yaml
          [ "$(images rendered-kind.yaml | wc -l)" -eq 3 ]
          [ "$(images rendered-kind.yaml)" = "$(images rendered-aws.yaml)" ]

      # Same chart version and settings as argocd/monitoring.yaml.
      - name: Render the monitoring stack
        run: |
          version=$(yq '.spec.sources[0].targetRevision' argocd/monitoring.yaml)
          echo "kube-prometheus-stack $version"
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm template kps prometheus-community/kube-prometheus-stack --version "$version" \
            -n monitoring -f monitoring/values-kind.yaml > rendered-monitoring.yaml

      # The same pinned, checksum-verified Argo CD install that
      # scripts/argocd-up.sh applies, with the trims in bootstrap/argocd.
      - name: Render the trimmed Argo CD install
        run: |
          commit=$(sed -n 's/^ARGOCD_COMMIT="\(.*\)"$/\1/p' scripts/argocd-up.sh)
          sha=$(sed -n 's/^ARGOCD_SHA256="\(.*\)"$/\1/p' scripts/argocd-up.sh)
          work=$(mktemp -d)
          curl -fsSL -o "$work/install.yaml" \
            "https://raw.githubusercontent.com/argoproj/argo-cd/$commit/manifests/install.yaml"
          echo "$sha  $work/install.yaml" | sha256sum --check
          cp bootstrap/argocd/kustomization.yaml "$work/"
          kubectl kustomize "$work" > rendered-argocd.yaml
          echo "Argo CD workloads:"
          yq 'select(.kind == "Deployment" or .kind == "StatefulSet") | .metadata.name' rendered-argocd.yaml
          removed=$(yq 'select(.kind == "Deployment" and (.metadata.name | test("dex|notifications|applicationset"))) | .metadata.name' rendered-argocd.yaml)
          [ -z "$removed" ]

      - name: Install kubeconform
        run: |
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform

      # Argo CD and Prometheus Operator objects are custom resources, so their
      # schemas come from the community CRD catalog. The Argo CD CRDs
      # themselves come unchanged from the checksum-verified upstream
      # manifest, and kubeconform has no schema for CRD objects.
      - name: Validate against Kubernetes, Argo CD and Prometheus Operator schemas
        run: |
          ./kubeconform -strict -summary -skip CustomResourceDefinition \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered-kind.yaml rendered-aws.yaml rendered-monitoring.yaml rendered-argocd.yaml \
            bootstrap/namespace.yaml bootstrap/monitoring-namespace.yaml argocd/

      # The image matches the Prometheus version the monitoring chart runs.
      - name: Check and unit-test the alert rules with promtool
        run: |
          yq 'select(.kind == "PrometheusRule") | .spec' rendered-kind.yaml \
            > monitoring/tests/swiggy-rules.yaml
          promtool() {
            docker run --rm -v "$PWD/monitoring/tests:/t:ro" -w /t \
              --entrypoint promtool quay.io/prometheus/prometheus:v3.15.0 "$@"
          }
          promtool check rules swiggy-rules.yaml
          promtool test rules swiggy-alerts-test.yaml

      - name: Check the Grafana dashboard is valid JSON
        run: jq -e '.panels | length > 0' charts/swiggy/files/dashboard.json

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aws

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialise without a backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate

  ansible:
    name: Lint Ansible
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible and ansible-lint
        run: pipx install --include-deps ansible-lint

      - name: Check playbook syntax
        env:
          SWIGGY_SERVER_IP: 192.0.2.10
        run: ansible-playbook playbooks/site.yml --syntax-check

      - name: Lint playbooks and roles
        run: ansible-lint playbooks/site.yml

  security:
    name: Scan Configuration with Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Kubernetes and Terraform configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
