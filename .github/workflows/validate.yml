name: Validate Infrastructure

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.6.7
  TERRAFORM_VERSION: 1.17.1
  HELM_VERSION: v4.3.1

jobs:
  kubernetes:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint the chart for each environment
        run: |
          helm lint --strict charts/swiggy -f charts/swiggy/values-kind.yaml
          helm lint --strict charts/swiggy -f charts/swiggy/values-aws.yaml \
            --set ingress.partnerHost=partner.192-0-2-10.sslip.io

      - name: Render the chart for each environment
        run: |
          helm template swiggy charts/swiggy -n swiggy \
            -f charts/swiggy/values-kind.yaml > rendered-kind.yaml
          helm template swiggy charts/swiggy -n swiggy \
            -f charts/swiggy/values-aws.yaml \
            --set ingress.partnerHost=partner.192-0-2-10.sslip.io > rendered-aws.yaml

      - name: Check both environments deploy the same image tag
        run: |
          kind_tag=$(grep -m1 -oE 'swiggy-devsecops-backend:[0-9a-f]{40}' rendered-kind.yaml)
          aws_tag=$(grep -m1 -oE 'swiggy-devsecops-backend:[0-9a-f]{40}' rendered-aws.yaml)
          echo "kind: $kind_tag"
          echo "aws:  $aws_tag"
          [ -n "$kind_tag" ] && [ "$kind_tag" = "$aws_tag" ]

      - name: Install kubeconform
        run: |
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform

      # Argo CD's Application and AppProject are custom resources, so their
      # schemas come from the community CRD catalog.
      - name: Validate against Kubernetes and Argo CD schemas
        run: |
          ./kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered-kind.yaml rendered-aws.yaml bootstrap/namespace.yaml argocd/

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aws

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialise without a backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate

  ansible:
    name: Lint Ansible
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible and ansible-lint
        run: pipx install --include-deps ansible-lint

      - name: Check playbook syntax
        env:
          SWIGGY_SERVER_IP: 192.0.2.10
        run: ansible-playbook playbooks/site.yml --syntax-check

      - name: Lint playbooks and roles
        run: ansible-lint playbooks/site.yml

  security:
    name: Scan Configuration with Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Kubernetes and Terraform configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
