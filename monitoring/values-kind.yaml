# kube-prometheus-stack settings for the local kind cluster.
# Argo CD installs the chart with this file (argocd/monitoring.yaml).
# Sized for a small VM: every component has requests and limits, Prometheus
# keeps 12 hours of data, and only what this project looks at is collected.

fullnameOverride: kps

# kind does not expose these control plane components to Prometheus, so
# scraping them would only produce "target down" alerts.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

# The API server's own metrics were over half of all series in Prometheus
# (32,000 of 60,000) and only feed the API server SLO rules switched off below.
kubeApiServer:
  enabled: false

kubelet:
  serviceMonitor:
    # Duplicates of what the kubelet and cAdvisor endpoints already give.
    probes: false
    resource: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false
    # Need the API server metrics, which are not collected.
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
    # Per-container CPU and memory recording rules, and the cluster capacity
    # alerts built on them; they only fed the built-in dashboards.
    k8sContainerCpuUsageSecondsTotal: false
    k8sContainerMemoryCache: false
    k8sContainerMemoryRss: false
    k8sContainerMemorySwap: false
    k8sContainerMemoryWorkingSetBytes: false
    k8sContainerResource: false
    kubernetesResources: false
    network: false

windowsMonitoring:
  enabled: false

prometheusOperator:
  # The admission webhook needs certificate jobs and extra RBAC; the
  # PrometheusRule objects here are validated in CI with kubeconform instead.
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  resources:
    requests: { cpu: 20m, memory: 48Mi }
    limits: { cpu: 200m, memory: 128Mi }

prometheus:
  prometheusSpec:
    retention: 12h
    retentionSize: 512MB
    # Cluster targets every minute. The swiggy backend's ServiceMonitor keeps
    # its own 30-second interval so the dashboard's 1-minute rates still work.
    scrapeInterval: 60s
    evaluationInterval: 30s
    # Pick up ServiceMonitors and PrometheusRules from any namespace, not
    # only ones carrying this Helm release's label. The swiggy chart ships
    # its own in the swiggy namespace.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 160Mi }
      limits: { cpu: 500m, memory: 512Mi }

alertmanager:
  alertmanagerSpec:
    retention: 24h
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 100m, memory: 64Mi }

grafana:
  # Admin login comes from a Secret created by scripts/kind-up.sh, never from Git.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Loads dashboards from ConfigMaps labelled grafana_dashboard=1 in any
  # namespace, including the swiggy app's dashboard.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    # The datasource sidecar is a second ~85 MB Python process that only
    # loads one datasource; Grafana reads it from its own config instead.
    datasources:
      enabled: false
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          url: http://kps-prometheus.monitoring:9090/
          access: proxy
          isDefault: true
          jsonData:
            timeInterval: 30s
  # Alerts are evaluated by Prometheus and routed by Alertmanager, so
  # Grafana's own alerting engine is off. Nothing is downloaded at startup.
  grafana.ini:
    unified_alerting:
      enabled: false
    plugins:
      preinstall_disabled: true
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
    news:
      news_feed_enabled: false
  env:
    # Soft heap limit; see bootstrap/argocd/kustomization.yaml.
    GOMEMLIMIT: 160MiB
  defaultDashboardsTimezone: browser
  # Only the Swiggy dashboard is loaded. The chart's ~25 built-in Kubernetes
  # dashboards cost Grafana memory and need the metrics switched off above.
  defaultDashboardsEnabled: false
  # Grafana's own metrics were 5,000 series; nothing here uses them.
  serviceMonitor:
    enabled: false
  # 256Mi was OOMKilled while loading the built-in dashboards on Grafana 13.
  resources:
    requests: { cpu: 25m, memory: 160Mi }
    limits: { cpu: 500m, memory: 384Mi }

kube-state-metrics:
  # Only the object types the alerts and dashboard read, plus the ones the
  # remaining built-in alerts use.
  collectors:
    - daemonsets
    - deployments
    - jobs
    - namespaces
    - nodes
    - persistentvolumeclaims
    - pods
    - replicasets
    - statefulsets
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 96Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { cpu: 100m, memory: 64Mi }
