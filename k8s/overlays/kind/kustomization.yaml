apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/paighanutkarsh2410-lab/swiggy-devsecops-backend
    newTag: 05003cb2a8532dbae0848372507375d7716367a6
  - name: ghcr.io/paighanutkarsh2410-lab/swiggy-devsecops-frontend
    newTag: 05003cb2a8532dbae0848372507375d7716367a6
  - name: ghcr.io/paighanutkarsh2410-lab/swiggy-devsecops-partner
    newTag: 05003cb2a8532dbae0848372507375d7716367a6

secretGenerator:
  # secrets.env is created by scripts/kind-up.sh and is never committed.
  - name: swiggy-secrets
    namespace: swiggy
    envs:
      - secrets.env

patches:
  # Expose both websites on the kind node so the host can reach them.
  - target:
      kind: Service
      name: frontend
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  - target:
      kind: Service
      name: partner
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30082
