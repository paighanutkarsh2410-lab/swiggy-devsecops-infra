apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: swiggy

resources:
  - namespace.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - network-policies.yaml

configMapGenerator:
  # Copy of backend/db/init.sql from swiggy-devsecops-app.
  - name: postgres-init
    files:
      - 01-init.sql=db/init.sql

labels:
  - pairs:
      app.kubernetes.io/part-of: swiggy-devsecops
